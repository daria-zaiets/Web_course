<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Kone-Kallio</title>
  </head>
  <body>
    <header>
      <img
        src="imges/KoneKallio-logo.png"
        alt="Kone-Kallio-logo"
        width="150px"
      />
      <nav class="main-menu">
        <ul>
          <li class="main-menu-li">
            <a href="./index.html">Home</a>
          </li>
          <li class="main-menu-li">
            <a href="./listing.html">Catalog</a>
          </li>
          <li class="main-menu-li">
            <a href="./about.html">About</a>
          </li>
          <li class="main-menu-li">
            <a href="./contact.html">Contact us</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Yhteystiedot</h1>
      <p>
        Autamme mielellämme sopivan koneen valinnassa. Voit ottaa meihin
        yhteyttä puhelimitse, sähköpostitse tai lähettämällä vuokrauskyselyn
        alla olevalla lomakkeella.
      </p>
      <ul>
        <li>Puhelin: 040 123 4567</li>
        <li>Sähköposti: info@konekallio.fi</li>
      </ul>

      <h2>Vuokrauskysely</h2>
      <form>
        <div>
          <label for="first-name">Etunimi: </label>
          <input
            type="text"
            name="first-name"
            id="first-name"
            placeholder="Markku"
            required
          />
        </div>

        <div>
          <label for="last-name">Sukunimi: </label>
          <input
            type="text"
            name="last-name"
            id="last-name"
            placeholder="Kallio"
            required
          />
        </div>

        <div>
          <label for="email">Sähköposti: </label>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="kallio@example.com"
            required
          />
        </div>

        <div>
          <label for="phone-number">Puhelinnumero: </label>
          <input
            type="tel"
            name="phone-number"
            id="phone-number"
            placeholder="0401234567"
          />
        </div>

        <div>
          <label for="rental-item">Vuokrattava kone: </label>
          <select name="rental-item" id="rental-item" required>
            <option value="" disabled selected hidden>--Valintse kone--</option>
            <option value="kubota-kx019-4">Minikaivuri - Kubota KX019-4</option>
            <option value="bobcat-e20">Minikaivuri - Bobcat E20</option>
            <option value="husqvarna-lf75">Tärylevy - Husqvarna LF75</option>
            <option value="wacker-neuson-wp1550">
              Tärylevy - Wacker Neuson WP1550
            </option>
            <option value="lumag-hez30">Halkomakone - Lumag HEZ30</option>
          </select>
        </div>

        <div>
          <label for="sart-date">Vuokrauksen alkamispäivä: </label>
          <input type="date" name="sart-date" id="sart-date" required />
        </div>

        <div>
          <label for="end-date">Vuokrauksen päättymispäivä: </label>
          <input type="date" name="end-date" id="end-date" required />
        </div>

        <div>
          <label for="additional-info">Lisätietoja: </label>
          <textarea name="additional-info" id="additional-info"></textarea>
        </div>

        <input type="submit" value="Lähetä kysely" />
      </form>
    </main>
    <footer></footer>
  </body>
</html>
